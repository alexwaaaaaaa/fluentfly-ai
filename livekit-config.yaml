port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  # Force use of localhost for development
  use_external_ip: false
  # Announce localhost as the ICE candidate
  node_ip: "127.0.0.1"
  
# Enable ICE Lite mode for simpler NAT traversal
ice_lite: true

# TURN server configuration (optional, for better connectivity)
turn:
  enabled: false

# Logging
logging:
  level: info
  
keys:
  devkey: secret
