name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend code
        working-directory: backend
        run: npm run lint

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Check mobile formatting
        working-directory: mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze mobile code
        working-directory: mobile
        run: flutter analyze

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for vulnerable dependencies
        working-directory: backend
        run: |
          npm audit --audit-level=moderate
        continue-on-error: true

  size-check:
    name: Docker Image Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fluentfly-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          SIZE=$(docker images fluentfly-backend:test --format "{{.Size}}")
          echo "Docker image size: $SIZE"
          # Add size validation if needed

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan, dependency-check, size-check]
    if: always()

    steps:
      - name: PR Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## Pull Request Checks Summary
            
            | Check | Status |
            |-------|--------|
            | Lint & Format | ${{ needs.lint-and-format.result }} |
            | Security Scan | ${{ needs.security-scan.result }} |
            | Dependencies | ${{ needs.dependency-check.result }} |
            | Image Size | ${{ needs.size-check.result }} |
            
            ${needs.lint-and-format.result === 'failure' ? '⚠️ Please fix linting issues' : ''}
            ${needs.security-scan.result === 'failure' ? '⚠️ Security vulnerabilities detected' : ''}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
